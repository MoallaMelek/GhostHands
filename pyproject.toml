[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosthands"
version = "0.1.0"
description = "Auditable learning from demonstration in a lightweight tabletop world"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "matplotlib>=3.8,<4", "pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ghosthands = "ghosthands.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghosthands = ["ui/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
